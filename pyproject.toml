[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher-editor"
version = "0.1.0"
description = "Manage Freedesktop desktop entries and application icons"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "ktmitax"}]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/ktmitax/LauncherEditor"

[project.scripts]
launcher-editor = "launcher_editor.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launcher_editor = ["data/*.css", "data/*.svg", "locale/**/*.mo"]
